{% extends "rehab/base.html" %}
{% load static %}

{% block title %}
    Charts
{% endblock %}

{% block rehab_content %}
    <h1>Charts</h1>

    <h2>Exercises by Difficulty</h2>
    <div id="chart1"></div>
    <p><a href="{% url 'vegaChart1' %}">View this chart as an image</a></p>

    <h2>Workout Sessions by Date</h2>
    <div id="chart2"></div>
    <p><a href="{% url 'vegaChart2' %}">View this chart as an image</a></p>

    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <script>
        vegaEmbed("#chart1", "{% static 'vega/chart1.json' %}");
        vegaEmbed("#chart2", "{% static 'vega/chart2.json' %}");
    </script>
{% endblock %}
