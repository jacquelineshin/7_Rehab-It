{% extends "account/base.html" %}

{% block title %}
    User Details
{% endblock %}

{% block account_content %}
    <h1>User Details</h1>
    <ul>
        {% for user_detail_for_loop in user_detail_html %}
            <li>
                <a href="">{{ user_detail_for_loop }}</a>
            </li>
        {% empty %}
            <li>No user details exist.</li>
        {% endfor %}
    </ul>
{% endblock %}
